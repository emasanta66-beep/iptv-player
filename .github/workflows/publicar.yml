name: Publicar instalador

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Crear etiqueta de la versión
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v$V"
          git push -f origin "v$V"
      - name: Crear el Release antes de subir archivos (evita duplicados)
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "IPTV Player $V" --notes "Versión $V"
      - name: Crear instalador y publicar Release
        run: npm run publish

name: Publicar instalador

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Crear etiqueta de la versión
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v$V"
          git push -f origin "v$V"
      - name: Crear el Release antes de subir archivos (evita duplicados)
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "IPTV Player $V" --notes "Versión $V"
      - name: Crear instalador y publicar Release
        shell: pwsh
        run: |
          # GitHub a veces responde 504 (tiempo de espera agotado) justo al subir
          # el instalador. Esto no es un error del proyecto, así que se reintenta solo.
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Intento $i de $maxAttempts..."
            npm run publish
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Falló (código $LASTEXITCODE), puede ser un corte pasajero de GitHub. Reintentando en 20 s..."
            Start-Sleep -Seconds 20
          }
          Write-Host "Se agotaron los reintentos."
          exit 1

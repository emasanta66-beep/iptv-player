<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: http: https:; media-src * blob: data:; img-src * data: blob:; connect-src * blob: data:;">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">IPTV Player</div>
    <label class="lbl">Lista activa</label>
    <select id="playlistSelect"></select>
    <div class="row">
      <button id="btnAdd" class="btn primary">+ Añadir</button>
      <button id="btnDel" class="btn">Quitar</button>
    </div>
    <nav id="nav">
      <button data-tab="home" class="active">⌂ Inicio</button>
      <button data-tab="live">📺 En vivo</button>
      <button data-tab="movie">🎬 Películas</button>
      <button data-tab="series">🎞️ Series</button>
      <button data-tab="favs">★ Favoritos</button>
      <button data-tab="continue">⏯ Continuar viendo</button>
      <button data-tab="downloads">⬇ Descargas</button>
    </nav>
    <div class="upd">
      <div id="verLbl" class="ver"></div>
      <button id="btnUpd" class="btn">🔄 Buscar actualizaciones</button>
      <div id="updMsg" class="updmsg"></div>
      <button id="btnRel" class="linkbtn">Ver novedades en GitHub</button>
    </div>
    <div id="status" class="status">Añade una lista para empezar</div>
  </aside>

  <main id="main">
    <section id="playerWrap" class="hidden">
      <div id="videoBox">
        <div id="vstage">
          <video id="video" autoplay></video>
          <button id="btnInfo" class="vbtn" title="Información">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          </button>
          <div id="vinfo" class="hidden"></div>
          <div id="nextOverlay" class="hidden">
            <div>Siguiente: <b id="nextTitle"></b></div>
            <div>en <span id="nextCount">5</span> s</div>
            <div class="row">
              <button id="btnNextNow" class="btn primary">Reproducir ya</button>
              <button id="btnNextCancel" class="btn">Cancelar</button>
            </div>
          </div>
          <div id="playerError" class="hidden"></div>
        </div>

        <div id="vbar" class="vbar">
          <button id="vPlay" class="vbtn" title="Reproducir">
            <svg class="i-play" viewBox="0 0 24 24"><polygon class="f" points="7 4 20 12 7 20 7 4"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><rect class="f" x="6" y="4" width="4" height="16" rx="1"/><rect class="f" x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button id="btnBack10" class="vbtn" title="Retroceder 10 segundos">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="15" text-anchor="middle">10</text></svg>
          </button>
          <button id="btnFwd10" class="vbtn" title="Avanzar 10 segundos">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15" text-anchor="middle">10</text></svg>
          </button>

          <div class="vseek">
            <input id="vSeek" class="vrange" type="range" min="0" max="0" step="any" value="0" aria-label="Progreso">
            <div class="vtimes"><span id="vCur">0:00</span><span id="vDur">0:00</span></div>
          </div>
          <div class="vlive">EN VIVO</div>

          <div class="vvol">
            <button id="vMute" class="vbtn" title="Silenciar">
              <svg class="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg class="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
            </button>
            <input id="vVol" class="vrange" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volumen">
          </div>

          <div class="vwrap">
            <button id="btnTracks" class="vbtn" title="Audio y subtítulos">
              <svg class="i-cc-on" viewBox="0 0 24 24"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
              <svg class="i-cc-off" viewBox="0 0 24 24"><rect width="18" height="14" x="3" y="5" rx="2" ry="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
            </button>
            <div id="trackMenu" class="vmenu hidden"></div>
          </div>
          <div class="vwrap">
            <button id="btnSpeed" class="vbtn" title="Velocidad">
              <svg viewBox="0 0 24 24"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
            </button>
            <div id="speedMenu" class="vmenu hidden"></div>
          </div>
          <button id="btnPip" class="vbtn" title="Imagen en imagen">
            <svg viewBox="0 0 24 24"><path d="M21 9V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h4"/><rect width="10" height="7" x="12" y="13" rx="2"/></svg>
          </button>
          <button id="btnFs" class="vbtn" title="Pantalla completa (F)">
            <svg class="i-fs" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            <svg class="i-fsx" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
          </button>
        </div>
      </div>
      <div id="playerSide">
        <div id="nowTitle" class="now-title"></div>
        <div class="row">
          <button id="btnPrev" class="btn">⏮ Anterior</button>
          <button id="btnNext" class="btn">Siguiente ⏭</button>
          <button id="btnFavNow" class="btn">★</button>
          <button id="btnAudio" class="btn" title="Convierte el audio a un formato compatible">🔊 Reparar audio</button>
          <button id="btnVlc" class="btn">Abrir en VLC</button>
          <button id="btnCinema" class="btn" title="Ocultar biblioteca y ampliar el reproductor">▣ Modo cine</button>
          <button id="btnClose" class="btn">✕</button>
        </div>
        <label class="auto"><input type="checkbox" id="autoNext" checked> Siguiente capítulo automático</label>
        <div id="epg"></div>
      </div>
    </section>

    <section id="browser">
      <div id="toolbar">
        <select id="catSelect" class="hidden"></select>
        <button id="btnCatEdit" class="btn hidden" title="Elegir qué categorías aparecen primero">⇅ Ordenar</button>
        <input id="search" type="search" placeholder="Buscar...">
      </div>
      <div id="crumb" class="hidden"></div>
      <div id="grid"></div>
      <div class="center"><button id="btnMore" class="btn hidden">Mostrar más</button></div>
    </section>
  </main>
</div>

<dialog id="dlgAdd">
  <form method="dialog" id="formAdd">
    <h3>Añadir lista</h3>
    <div class="tabs">
      <button type="button" data-kind="xtream" class="active">Xtream Codes</button>
      <button type="button" data-kind="m3u">M3U (URL o archivo)</button>
    </div>
    <label>Nombre<input id="fName" placeholder="Mi lista"></label>
    <div id="boxXtream">
      <label>Servidor<input id="fServer" placeholder="http://servidor.com:8080"></label>
      <label>Usuario<input id="fUser"></label>
      <label>Contraseña<input id="fPass" type="password"></label>
    </div>
    <div id="boxM3u" class="hidden">
      <label>URL de la lista<input id="fUrl" placeholder="http://.../lista.m3u"></label>
      <button type="button" id="btnFile" class="btn">Elegir archivo .m3u…</button>
      <span id="fileName" class="muted"></span>
      <label>URL de EPG XMLTV (opcional)<input id="fEpg" placeholder="http://.../epg.xml o .xml.gz"></label>
    </div>
    <div class="row end">
      <button type="button" id="btnCancelAdd" class="btn">Cancelar</button>
      <button type="submit" id="btnSaveAdd" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgCats">
  <h3>Ordenar categorías</h3>
  <div class="muted">Las que pongas arriba aparecen primero en la lista.</div>
  <div id="catList" class="catlist"></div>
  <div class="row end">
    <button type="button" id="btnCatReset" class="btn">Orden original</button>
    <button type="button" id="btnCatCancel" class="btn">Cancelar</button>
    <button type="button" id="btnCatSave" class="btn primary">Guardar</button>
  </div>
</dialog>

<script src="../node_modules/hls.js/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
